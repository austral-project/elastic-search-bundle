services:

##### Command to Elastic Search index
  Austral\ElasticSearchBundle\Command\ElasticSearchCommand:
    arguments:
      $elasticSearch: '@austral.elastic_search'
      $requestStack: '@request_stack'
    calls:
      - [ setEventDispatcher, [ '@event_dispatcher' ] ]
    tags:
      - { name: console.command, command: "austral:elastic-search" }
